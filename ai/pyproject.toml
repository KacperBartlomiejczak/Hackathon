[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.32.0",
    "boto3==1.44.9",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    "rapidfuzz==3.14.6",
    "trafilatura==2.3.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 = forbid print

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
