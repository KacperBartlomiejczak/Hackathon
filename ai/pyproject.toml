[project]
name = "investwatch-ai"
version = "0.1.0"
description = "InvestWatch AI service: preprocessing, embeddings, modules M1/M2/M3, scoring"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.32.0",
    "boto3==1.43.126",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "trafilatura==2.3.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.uv]
package = false
# Supply-chain guard (kept from other machine): resolve only releases older than ~2 weeks.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 = forbid print

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
