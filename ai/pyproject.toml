[project]
name = "investwatch-ai"
version = "0.1.0"
description = "InvestWatch AI service: preprocessing, embeddings, modules M1/M2/M3, scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false
# Supply-chain guard: only resolve releases at least ~2 weeks old.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 = forbid print()

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
