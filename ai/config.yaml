# Scoring: score = w_llm*llm + w_rules*rules + w_emb*emb
# Runtime overrides live in DB table module_settings (editable from the calibration panel).
# Model name is NOT here: set OLLAMA_LLM_MODEL and OLLAMA_EMBED_MODEL in .env.
weights:
  w_llm: 0.6
  w_rules: 0.25
  w_emb: 0.15

risk:
  high: 0.8        # score >= high -> risk_level "high" -> alert to api

thresholds:        # per-module flag threshold (medium risk and above)
  m1: 0.6
  m2: 0.6
  m3: 0.6

llm:
  timeout_s: 60
  retries: 1
  temperature: 0
