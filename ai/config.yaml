# Scoring: score = w_llm*llm + w_rules*rules + w_emb*emb
# Runtime overrides live in DB table module_settings (editable from the calibration panel).
# Model name is NOT here: set OLLAMA_LLM_MODEL and OLLAMA_EMBED_MODEL in .env.
weights:
  w_llm: 0.6
  w_rules: 0.25
  w_emb: 0.15

risk:
  high: 0.8        # score >= high -> risk_level "high" -> alert to api

thresholds:        # per-module flag threshold (medium risk and above)
  m1: 0.6
  m2: 0.6
  m3: 0.6

llm:
  # Measured on Bielik 11B Q4 (local Ollama): ~37 s per M2 call warm, 60 s+ cold. 60 s was too tight.
  timeout_s: 120
  retries: 1
  temperature: 0

analysis:
  # Wall-clock budget per document for all modules together; must stay below the collector timeout (300 s).
  # Modules run concurrently; one that misses the budget or fails is skipped (no invented score).
  budget_s: 240

embedding:         # raw bge-m3 cosine to anchor phrases is mapped linearly: <= floor -> 0, >= ceil -> 1
  floor: 0.45
  ceil: 0.75
