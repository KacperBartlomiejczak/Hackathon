# M3 phrase rules: regex (case-insensitive, Polish inflection tolerant) -> weight. rules score = min(1, sum of distinct hits).
version: m3-rules-v3
rules:
  - {id: advisory_offer, weight: 0.35, pattern: 'doradz\w+ inwestycyjn\w+|doradc\w+ inwestycyjn\w+|indywidualn\w+ doradztw\w+|rekomendacj\w+ inwestycyjn\w+|indywidualn\w+ rekomendacj\w+'}
  - {id: portfolio_management, weight: 0.4, pattern: 'zarządza\w* (?:tw\w+ )?(?:portfel\w*|kapitał\w*|aktyw\w*|pieniędz\w*)|prowadzę (?:tw\w+ )?portfel\w*'}
  - {id: signals, weight: 0.3, pattern: 'sygnał\w* (?:inwestycyjn|handlow|kupna|sprzedaży)\w*'}
  - {id: direct_recommendation, weight: 0.3, pattern: '(?<!\w)kupuj\b|(?<!\w)sprzedaj\b|cen\w+ docelow\w+|trzymaj (?:akcj|pozycj|obligacj)\w+|stop ?loss|take ?profit'}
  - {id: paid_service, weight: 0.2, pattern: 'płatn\w+ (?:grup\w+|subskrypcj\w+|sygnał\w+|doradztw\w+)|abonament|mentoring inwestycyjn\w+'}
  - {id: private_channel, weight: 0.1, pattern: 'wiadomoś\w+ prywatn\w+|napisz (?:do (?:mnie|nas) )?(?:na )?(?:privie|priv|dm|whatsapp|telegram)|grup\w+ (?:vip|premium|prywatn\w+)'}
