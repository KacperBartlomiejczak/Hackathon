# Upsertowane do tabeli `sources` przy starcie collectora.
sources:
  - kind: sample
    name: UKNF sample data
    module_hint: null
    enabled: true
    cron: null
  - kind: web
    name: example.com (smoke test)
    start_url: https://example.com
    module_hint: null
    enabled: false
    cron: null
  # Live blogs (step 20): start page + up to 20 same-host keyword links.
  - kind: web
    name: Jak oszczędzać pieniądze (blog)
    start_url: https://jakoszczedzacpieniadze.pl
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: web
    name: Marcin Iwuć (blog)
    start_url: https://marciniwuc.com
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: web
    name: Subiektywnie o finansach (blog)
    start_url: https://subiektywnieofinansach.pl
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  # YouTube (step 22): public channel RSS, last 15 videos (title + description).
  - kind: youtube
    name: Strefa Inwestorów (YouTube)
    start_url: https://www.youtube.com/channel/UC4Qc_TYL6BsqiqXXorBFoaA
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: youtube
    name: Inwestomat (YouTube)
    start_url: https://www.youtube.com/channel/UCbTCMPrEGARddFKS5P9onoA
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: youtube
    name: XTB Polska (YouTube)
    start_url: https://www.youtube.com/channel/UCILwajCs145hxNvB4nckALg
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  # TikTok (#51): profile listing is empty for headless browsers (TikTok serves no itemList), so single public videos are used (fallback).
  - kind: tiktok
    name: XTB Polska - day trading (TikTok)
    start_url: https://www.tiktok.com/@xtbpl/video/7266023983877868833
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: tiktok
    name: Sówka Inwestówka - GPW (TikTok)
    start_url: https://www.tiktok.com/@sowka.inwestowka/video/7508830799165230358
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  # Facebook (best effort): only public pages without login. Page = og:title + og:description, posts only when a permalink is visible.
  # Pages that need login (e.g. xtbpolska, dmbossa) end as an error in crawl_runs, so they are not listed.
  - kind: facebook
    name: Bankier.pl (Facebook)
    start_url: https://www.facebook.com/Bankier.pl
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: facebook
    name: Strefa Inwestorów (Facebook)
    start_url: https://www.facebook.com/strefainwestorow
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
  - kind: facebook
    name: StockWatch.pl (Facebook)
    start_url: https://www.facebook.com/Stockwatch.pl
    module_hint: null
    enabled: true
    cron: '0 */6 * * *'
